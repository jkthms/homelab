# Values for kube-prometheus-stack. Pin chart version in the matching
# Application manifest under k8s/apps/monitoring.yaml.
#
# Grafana admin credentials are NOT in this file. Create the secret
# out-of-band so the password never lands in git:
#
#   kubectl -n monitoring create secret generic grafana-admin-credentials \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password='<choose-one>'

grafana:
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  # Exposed via Traefik (k3s default) on the LAN. Resolution of the hostname
  # is handled separately — until local DNS is in place, test with:
  #   curl -H "Host: grafana.apex.home" http://192.168.1.50
  # or add `192.168.1.50 grafana.apex.home` to /etc/hosts on your client.
  ingress:
    enabled: true
    ingressClassName: traefik
    path: /
    pathType: Prefix
    hosts:
      - grafana.apex.home
